name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  retirement:
    name: Verify legacy source retirement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify retired sources and unchanged migration history
        env:
          RETIRED_REVISION: 841fd00c97eab7fb67c62b6a645b514e6c6989c9
        shell: bash
        run: |
          set -euo pipefail
          retired=(
            apps/api apps/web packages plugins/github
            package.json pnpm-lock.yaml pnpm-workspace.yaml
            biome.json lefthook.yml tsconfig.base.json turbo.json
            scripts/build-release.sh scripts/bundle-budget-lib.ts scripts/bundle-budget.ts
            scripts/gen-conventions-page.ts scripts/gen-feedback-example-page.ts
            scripts/release-assets/wrangler.example.toml
            .github/workflows/docs.yml .github/workflows/release-prepare.yml
            .github/workflows/release-tag.yml .github/workflows/release.yml
          )
          for path in "${retired[@]}"; do
            if test -e "$path"; then
              printf 'Retired source remains: %s\n' "$path" >&2
              exit 1
            fi
          done
          git diff --exit-code "$RETIRED_REVISION:packages/db/migrations" HEAD:migrations
          git diff --exit-code "$RETIRED_REVISION" HEAD -- README.md apps/docs docs
          git diff --check "$RETIRED_REVISION" HEAD
          printf 'Legacy sources retired. Historical SQL and documentation are unchanged.\n'
          printf 'This source-only transition has no runnable application. Application tests are not run.\n'
