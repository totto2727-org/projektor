name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: totto2727-org/monorepo/.github/actions/setup-nix@main
      - uses: totto2727-org/monorepo/.github/actions/setup-typescript@main
        with:
          install-args: --frozen-lockfile
      - name: Verify Vite+ project
        run: |
          eval "$(nix print-dev-env "$GITHUB_WORKSPACE#default")"
          vp run ci
        env:
          NODE_OPTIONS: --max-old-space-size=8192
