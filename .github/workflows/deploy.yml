name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: projektor-production
      cancel-in-progress: false
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Deploy the revision that passed CI, not a newer unverified main HEAD.
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: totto2727-org/monorepo/.github/actions/setup-nix@main
        with:
          dev-shell: ci
      - uses: totto2727-org/monorepo/.github/actions/setup-typescript@main
      - name: Deploy production
        run: |
          eval "$(nix print-dev-env "$GITHUB_WORKSPACE#ci")"
          vp run deploy --yes
        env:
          CLOUDFLARE_ACCOUNT_ID: '5643a837ef66765e7881c0831a36ebed'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
