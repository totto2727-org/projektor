name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Unlike template/vite-plus-app, this source has no flake/dev shell.
      # Use its pinned pnpm packageManager and a compatible Node runtime instead
      # of adopting the template's Nix-dependent setup sequence.
      - uses: pnpm/action-setup@v4.2.0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "22.18.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify Vite+ project
        run: pnpm exec vp run ci
        env:
          NODE_OPTIONS: --max-old-space-size=8192
